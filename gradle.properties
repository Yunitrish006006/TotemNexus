org.gradle.jvmargs=-Xmx1G
# Minecraft 26.x runs against the named namespace.  Keep the publishable JAR
# unremapped so resource ownership is retained in the final artifact.
fabric.loom.dontRemap=true
minecraft_version=26.2
yarn_mappings=26.2+build.1
loader_version=0.19.3
fabric_version=0.154.2+26.2
# First complete authority release. DeadRecall activates it only through the
# exact 0.1.1 bundle pin and keeps the prior immutable pin for rollback.
mod_version=0.1.1
maven_group=dev.totem
archives_base_name=totem-nexus
