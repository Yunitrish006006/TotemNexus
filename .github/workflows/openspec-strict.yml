name: OpenSpec Strict

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest

      - name: Validate detail-zoom change strictly
        env:
          DO_NOT_TRACK: '1'
        run: openspec validate update-nexus-map-detail-zoom --strict --no-interactive
