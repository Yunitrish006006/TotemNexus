name: Publish Modrinth

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: modrinth-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MODULE_ID: totem-nexus
  # Reviewed Core 0.7.23 player-directory API.
  CORE_REF: 424b90dc3929caa8c1afcfca7e63c50a64bde669

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether this is a release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          REQUESTED_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test -n "$current"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
            echo "dry_run=${REQUESTED_DRY_RUN}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" 2>/dev/null || true)"
          previous="$(git show "${BEFORE_SHA}:gradle.properties" 2>/dev/null | sed -n 's/^mod_version=//p' || true)"
          if grep -Fxq '.github/workflows/publish-modrinth.yml' <<<"$changed" || [[ -z "$previous" || "$previous" != "$current" ]]; then
            echo 'should_publish=true' >> "$GITHUB_OUTPUT"
            echo 'dry_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_publish=false' >> "$GITHUB_OUTPUT"
            echo 'dry_run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Require exact-source release gates
        id: gates
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          echo "source=$release_sha" >> "$GITHUB_OUTPUT"
          for workflow in build.yml; do
            passed=false
            for attempt in {1..120}; do
              runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${release_sha}&event=push&per_page=10")"
              latest="$(jq -c '.workflow_runs | sort_by(.run_number) | last // null' <<<"$runs")"
              if [[ "$(jq -r '.status // empty' <<<"$latest")" == completed ]]; then
                jq -e --arg sha "$release_sha" --arg repo "$GITHUB_REPOSITORY" '.conclusion=="success" and .head_sha==$sha and .event=="push" and .repository.full_name==$repo' <<<"$latest" >/dev/null
                if [[ "$workflow" == build.yml ]]; then
                  echo "run_id=$(jq -er .id <<<"$latest")" >> "$GITHUB_OUTPUT"
                  echo "run_attempt=$(jq -er .run_attempt <<<"$latest")" >> "$GITHUB_OUTPUT"
                fi
                passed=true
                break
              fi
              sleep 10
            done
            test "$passed" = true || { echo "Timed out waiting for ${workflow}; refusing publication." >&2; exit 1; }
          done

      - name: Resolve immutable artifact identity
        id: artifact
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          artifacts="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "release-${RELEASE_SHA}-${BUILD_RUN_ATTEMPT}" --arg run "$BUILD_RUN_ID" --arg source "$RELEASE_SHA" '[.[].artifacts[] | select(.name==$name)] | select(length==1) | .[0] | select(.expired==false and .size_in_bytes>0 and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$source) | .id' <<<"$artifacts")"
          echo "id=$artifact_id" >> "$GITHUB_OUTPUT"

      - name: Download exact Build artifact
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.id }}
          merge-multiple: true
          path: build/libs
          repository: ${{ github.repository }}
          run-id: ${{ steps.gates.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify immutable artifact provenance and SHA512
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          BUILD_RUN_ID: ${{ steps.gates.outputs.run_id }}
          BUILD_RUN_ATTEMPT: ${{ steps.gates.outputs.run_attempt }}
          RELEASE_SHA: ${{ steps.gates.outputs.source }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          artifact="${archive}-${version}.jar"
          sha="$(sha512sum "build/libs/${artifact}" | awk '{print $1}')"
          expected_sha="$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          core_sha="$(jq -er .core_artifact_sha512 ".github/staging/release-validation-${version}.json")"
          test "$sha" = "$expected_sha"
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg source "$RELEASE_SHA" --arg run "$BUILD_RUN_ID" --arg attempt "$BUILD_RUN_ATTEMPT" --arg version "$version" --arg artifact "$artifact" --arg sha "$sha" --arg core "$CORE_REF" --arg core_sha "$core_sha" '.repository==$repo and .source_commit==$source and .run_id==$run and .run_attempt==$attempt and .version==$version and .artifact==$artifact and .sha512==$sha and .core_version=="0.7.23" and .core_source_commit==$core and .core_artifact_sha512==$core_sha' build/libs/build-provenance.json >/dev/null

      - name: Validate or publish to Modrinth
        id: modrinth
        if: steps.release.outputs.should_publish == 'true'
        shell: bash
        env:
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          archive="$(sed -n 's/^archives_base_name=//p' gradle.properties)"
          minecraft="$(sed -n 's/^minecraft_version=//p' gradle.properties)"
          artifact="build/libs/${archive}-${version}.jar"
          test -n "$MODRINTH_TOKEN"
          test -n "$MODRINTH_PROJECT_ID"
          test -f "$artifact"
          unzip -p "$artifact" fabric.mod.json >/tmp/fabric.mod.json
          jq -e --arg id "$MODULE_ID" --arg version "$version" --arg minecraft "~${minecraft}" --arg core '>=0.7.23 <0.8.0' '.id == $id and .version == $version and .depends.minecraft == $minecraft and .depends["totem-core"] == $core' /tmp/fabric.mod.json >/dev/null

          api='https://api.modrinth.com/v2'
          ua="Yunitrish006006/${MODULE_ID}-publisher/2.0"
          args=(--silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H "User-Agent: ${ua}")
          modrinth_request() {
            local output="$1"
            shift
            local status
            status="$(curl "${args[@]}" --output "$output" --write-out '%{http_code}' "$@")"
            if [[ ! "$status" =~ ^2 ]]; then
              echo "Modrinth API request failed with HTTP ${status}." >&2
              jq -r 'if type == "object" then "\(.error // "unknown_error"): \(.description // .message // "No description returned")" else "No structured error returned" end' "$output" >&2 || true
              return 1
            fi
          }

          project_ref="$(printf '%s' "$MODRINTH_PROJECT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          project_ref="${project_ref#https://modrinth.com/project/}"
          project_ref="${project_ref#https://modrinth.com/mod/}"
          project_ref="${project_ref%/}"
          if ! modrinth_request /tmp/project.json "$api/project/${project_ref}"; then
            previous_marker="$(find .github/staging -maxdepth 1 -name 'modrinth-published-*.json' -print | sort -V | tail -1)"
            test -n "$previous_marker"
            previous_version_id="$(jq -er '.modrinth_version_id' "$previous_marker")"
            echo "Configured project reference failed; resolving it from ${previous_marker}." >&2
            modrinth_request /tmp/previous-version.json "$api/version/${previous_version_id}"
            project_ref="$(jq -er '.project_id' /tmp/previous-version.json)"
            modrinth_request /tmp/project.json "$api/project/${project_ref}"
          fi
          project="$(jq -er '.id' /tmp/project.json)"
          jq '{id,slug,status}' /tmp/project.json | tee /tmp/project-summary.json
          curl --fail-with-body "${args[@]}" "$api/project/${project}/version?include_changelog=false" >/tmp/versions.json
          count="$(jq --arg v "$version" '[.[] | select(.version_number == $v)] | length' /tmp/versions.json)"
          sha="$(sha512sum "$artifact" | awk '{print $1}')"
          test "$sha" = "$(jq -er .sha512 ".github/staging/release-validation-${version}.json")"
          if [[ "$DRY_RUN" == true ]]; then
            test "$count" = '0' || { echo "Version ${version} already exists; choose an unused release version." >&2; exit 1; }
            echo "Validated unused version ${version}; dependencies: Fabric API and external totem-core-0.7.23.jar."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "project_id=$project" >> "$GITHUB_OUTPUT"
            echo "sha512=$sha" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          curl --fail-with-body "${args[@]}" "$api/project/${project}/version?include_changelog=false" >/tmp/versions.json
          count="$(jq --arg v "$version" '[.[] | select(.version_number == $v)] | length' /tmp/versions.json)"
          if [[ "$count" != 0 ]]; then
            test "$count" = '1'
            version_id="$(jq -er --arg v "$version" '.[] | select(.version_number == $v) | .id' /tmp/versions.json)"
            remote_sha="$(jq -er --arg v "$version" '.[] | select(.version_number == $v) | (([.files[] | select(.primary == true)][0] // .files[0]).hashes.sha512)' /tmp/versions.json)"
            test "$remote_sha" = "$sha" || { echo "Version ${version} exists with a different SHA-512." >&2; exit 1; }
            echo "Modrinth already has byte-identical ${MODULE_ID} ${version}; verifying it."
          else
            changelog_file=".github/staging/modrinth-changelog-${version}.md"
            if [[ -f "$changelog_file" ]]; then changelog="$(cat "$changelog_file")"; else changelog="$(git log -1 --format=%B)"; fi
            data="$(jq -nc --arg name "${MODULE_ID} ${version}" --arg version "$version" --arg changelog "$changelog" --arg project "$project" --arg minecraft "$minecraft" '{name:$name,version_number:$version,changelog:$changelog,dependencies:[{project_id:"P7dR8mSH",dependency_type:"required"},{file_name:"totem-core-0.7.23.jar",dependency_type:"required"}],game_versions:[$minecraft],version_type:"release",loaders:["fabric"],featured:false,status:"listed",project_id:$project,file_parts:["primary"],primary_file:"primary",environment:"client_and_server"}')"
            printf '%s\n' "$data" >/tmp/version-create.json
            curl --fail-with-body "${args[@]}" -X POST "$api/version" -F 'data=</tmp/version-create.json;type=application/json' -F "primary=@${artifact};filename=$(basename "$artifact");type=application/java-archive" >/tmp/version.json
            version_id="$(jq -er '.id' /tmp/version.json)"
          fi
          curl --fail-with-body "${args[@]}" "$api/version/${version_id}" >/tmp/remote.json
          jq -e --arg project "$project" --arg version "$version" --arg minecraft "$minecraft" --arg filename "$(basename "$artifact")" --arg sha "$sha" '.project_id == $project and .version_number == $version and .game_versions == [$minecraft] and .loaders == ["fabric"] and (([.files[] | select(.primary == true)][0] // .files[0]).filename == $filename) and (([.files[] | select(.primary == true)][0] // .files[0]).hashes.sha512 == $sha)' /tmp/remote.json >/dev/null
          jq -e --arg fabric 'P7dR8mSH' --arg core_file 'totem-core-0.7.23.jar' -f .github/scripts/verify-modrinth-remote-dependencies.jq /tmp/remote.json >/dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "project_id=$project" >> "$GITHUB_OUTPUT"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "sha512=$sha" >> "$GITHUB_OUTPUT"

      - name: Retain release artifact and non-sensitive validation metadata
        if: steps.release.outputs.should_publish == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-${{ github.sha }}
          path: |
            build/libs/totem-nexus-*.jar
            /tmp/project-summary.json
            /tmp/remote.json
          if-no-files-found: error

      - name: Submit project for public review
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.dry_run == 'false'
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ steps.modrinth.outputs.project_id }}
        run: |
          set -euo pipefail
          api='https://api.modrinth.com/v2'
          args=(--fail-with-body --silent --show-error --retry 3 -H "Authorization: ${MODRINTH_TOKEN}" -H 'User-Agent: Yunitrish006006/totem-nexus-publisher/2.0')
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" >/tmp/project-before-review.json
          status="$(jq -er '.status' /tmp/project-before-review.json)"
          if [[ "$status" != 'approved' && "$status" != 'processing' ]]; then
            curl "${args[@]}" -X PATCH -H 'Content-Type: application/json' \
              --data '{"requested_status":"approved"}' \
              "$api/project/${MODRINTH_PROJECT_ID}" >/dev/null
          fi
          curl "${args[@]}" "$api/project/${MODRINTH_PROJECT_ID}" >/tmp/project-after-review.json
          jq -e '.status == "approved" or .status == "processing" or .requested_status == "approved"' \
            /tmp/project-after-review.json >/dev/null

      - name: Record verified publication
        if: steps.release.outputs.should_publish == 'true' && steps.release.outputs.dry_run == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MOD_VERSION: ${{ steps.modrinth.outputs.version }}
          VERSION_ID: ${{ steps.modrinth.outputs.version_id }}
          SHA512: ${{ steps.modrinth.outputs.sha512 }}
        run: |
          set -euo pipefail
          marker=".github/staging/modrinth-published-${MOD_VERSION}.json"
          content="$(jq -n --arg version "$MOD_VERSION" --arg id "$VERSION_ID" --arg sha "$SHA512" --arg run "$GITHUB_RUN_ID" '{version:$version,modrinth_version_id:$id,sha512:$sha,verified_by_run:$run}')"
          encoded="$(printf '%s\n' "$content" | base64 -w0)"
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${marker}"
          existing="$(curl --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2022-11-28' "$api" | jq -r '.sha // empty')"
          payload="$(jq -n --arg message "release: record Modrinth ${MOD_VERSION}" --arg content "$encoded" --arg branch "$GITHUB_REF_NAME" --arg sha "$existing" 'if $sha == "" then {message:$message,content:$content,branch:$branch} else {message:$message,content:$content,branch:$branch,sha:$sha} end')"
          curl --fail --silent --show-error -X PUT -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$api" -d "$payload" >/dev/null
