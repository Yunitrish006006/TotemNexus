name: Build

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-gametest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Nexus
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check out pinned TotemCore
        uses: actions/checkout@v4
        with:
          repository: Yunitrish006006/TotemCore
          ref: dc06cd68242b968d6f75ca31c3dd8e493ca9be5d
          path: .lockstep/TotemCore
          persist-credentials: false

      - name: Build TotemCore
        shell: bash
        run: |
          set -euo pipefail
          chmod +x .lockstep/TotemCore/gradlew
          ./.lockstep/TotemCore/gradlew -p .lockstep/TotemCore jar --no-daemon --stacktrace
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          test "$core_version" = '0.7.3'
          test -f ".lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"

      - name: Compile Nexus and tests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" \
            test assemble compileGametestJava --no-daemon --stacktrace

      - name: Run server GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" runGameTest --no-daemon --stacktrace

      - name: Run client GameTests
        shell: bash
        run: |
          set -euo pipefail
          core_version="$(sed -n 's/^mod_version=//p' .lockstep/TotemCore/gradle.properties)"
          core_jar="${GITHUB_WORKSPACE}/.lockstep/TotemCore/build/libs/totem-core-${core_version}.jar"
          xvfb-run -a ./.lockstep/TotemCore/gradlew -p "$GITHUB_WORKSPACE" \
            -PtotemCoreJar="$core_jar" runClientGameTest --no-daemon --stacktrace
