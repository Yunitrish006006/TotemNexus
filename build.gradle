plugins {
    id 'fabric-loom' version '1.17.12'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base { archivesName = project.archives_base_name }

def totemCoreJar = file(providers.gradleProperty('totemCoreJar')
        .getOrElse('../TotemCore/build/libs/totem-core-0.7.21.jar'))

loom {
    splitEnvironmentSourceSets()
    mods {
        'totem-nexus' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "totem-nexus-gametest"
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.codemc.io/repository/relativitymc/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "org.relativitymc:modern-yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    runtimeOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Local development artifact; release builds will consume the versioned Core API.
    modImplementation files(totemCoreJar)
    productionRuntimeMods files(totemCoreJar)
    productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def totemVisualModuleJars = providers.gradleProperty('totemVisualModuleJars').orNull
if (totemVisualModuleJars != null && !totemVisualModuleJars.isBlank()) {
    dependencies {
        totemVisualModuleJars.split(',').each { moduleJar ->
            modRuntimeOnly files(file(moduleJar.trim()))
        }
    }
}

tasks.withType(Test).configureEach { useJUnitPlatform() }

// Named development copies are private to this build. Never rewrite Gradle's shared
// official artifacts: the production runner and sibling modules consume those too.
def namedRuntimeSources = new LinkedHashSet<File>()
def namedRuntimeCopies = [:]
def namedRuntimeCopyFor = { File source ->
    namedRuntimeCopies.computeIfAbsent(source.absolutePath) {
        def digest = java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString()
        layout.buildDirectory.file("named-runtime-api/${digest}-${source.name}").get().asFile
    }
}
tasks.register('normalizeFabricApiTweakersForNamedDevRuntime') {
    group = 'fabric'
    description = 'Creates isolated named-namespace Fabric API copies for development runs.'
    doLast {
        def outputDir = layout.buildDirectory.dir('named-runtime-api').get().asFile
        outputDir.mkdirs()
        namedRuntimeSources.each { jarFile ->
            def zip = new java.util.zip.ZipFile(jarFile)
            try {
                def changes = [:]
                zip.entries().each { entry ->
                    if (!entry.directory && (entry.name.endsWith('.classtweaker') || entry.name.endsWith('.accesswidener'))) {
                        def original = zip.getInputStream(entry).getText('UTF-8')
                        def normalized = original.replaceFirst(/(?m)^((?:classTweaker|accessWidener)\s+v\d+\s+)official(\s*)$/, '$1named$2')
                        if (normalized != original) changes[entry.name] = normalized.getBytes('UTF-8')
                    }
                }
                def copy = namedRuntimeCopyFor(jarFile)
                if (!copy.isFile()) {
                    def out = new java.util.zip.ZipOutputStream(new FileOutputStream(copy))
                    try {
                        zip.entries().each { entry ->
                            out.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                            if (!entry.directory) out.write(changes[entry.name] ?: zip.getInputStream(entry).bytes)
                            out.closeEntry()
                        }
                    } finally { out.close() }
                }
            } finally { zip.close() }
        }
        logger.lifecycle("Prepared ${namedRuntimeCopies.size()} isolated named-runtime API copies.")
    }
}

gradle.projectsEvaluated {
    tasks.matching { it.name in ['runClient','runServer','runDatagen','runGameTest','runClientGameTest'] }.configureEach {
        dependsOn('normalizeFabricApiTweakersForNamedDevRuntime')
        // Resolve and replace before Loom finalizes its internalClasspath task input.
        def originals = classpath.files.toList()
        def copies = originals.collect { file ->
            if (file.name.startsWith('fabric-') && file.name.endsWith('.jar')) {
                namedRuntimeSources.add(file)
                return namedRuntimeCopyFor(file)
            }
            return file
        }
        setClasspath(files(copies))
    }
}

// Reuse the real Fabric runners while allowing a bounded map regression pass.
// CI omits this property and always receives every registered test.
def nexusTestFocus = providers.gradleProperty('nexusTestFocus').orElse('all')
tasks.named('processGametestResources').configure {
    inputs.property('nexusTestFocus', nexusTestFocus)
    doLast {
        if (nexusTestFocus.get() == 'map') {
            def manifest = file("${destinationDir}/fabric.mod.json")
            def data = new groovy.json.JsonSlurper().parse(manifest)
            data.entrypoints['fabric-gametest'] = data.entrypoints['fabric-gametest'].findAll {
                it.endsWith('NexusMapRecordingGameTest') || it.endsWith('NexusInterfaceLifecycleGameTest')
            }
            data.entrypoints['fabric-client-gametest'] = data.entrypoints['fabric-client-gametest'].findAll {
                it.endsWith('NexusMapPlayerMarkerClientGameTest') || it.endsWith('NexusSpaceUnitMapVisualGameTest') || it.endsWith('NexusObserverProviderClientGameTest')
            }
            manifest.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(data))
        } else if (nexusTestFocus.get() != 'all') {
            throw new GradleException('nexusTestFocus must be all or map')
        }
    }
}

tasks.register('productionGametestModJar', Jar) {
    dependsOn(sourceSets.gametest.classesTaskName, sourceSets.gametest.processResourcesTaskName)
    archiveClassifier = 'production-gametest'
    from sourceSets.gametest.output
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('runProductionClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
    dependsOn('productionGametestModJar')
    mods.from(tasks.named('productionGametestModJar').flatMap { it.archiveFile })
    jvmArgs.add('-Dfabric.client.gametest')
    jvmArgs.add('-Dfabric.client.gametest.disableNetworkSynchronizer=true')
    useXVFB = true
}

tasks.named("runClientGameTest").configure {
    doLast {
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_totem-standalone-*-before.png", "*_totem-standalone-*-after.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/safe-multi-repo-modularization"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_nexus-manual-spread-*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/nexus-manual-zh_tw"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include("*_nexus-manual-en-us-spread-*.png")
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/nexus-manual-en_us"))
        }
        copy {
            from(file("${buildDir}/run/clientGameTest/screenshots"))
            include(
                    "*_totem-nexus-array-through-wall.png",
                    "*_totem-nexus-array-and-build-sites-live.png",
                    "*_totem-nexus-complex-counted-array.png",
                    "*_totem-nexus-complex-build-sites.png",
                    "*_totem-nexus-space-unit-material-diagnostics.png",
                    "*_totem-nexus-space-unit-material-overlays-narrow.png",
                    "*_totem-nexus-space-unit-material-observer-overlays-disabled.png"
            )
            rename { name -> name.replaceFirst(/^\d+_/, "") }
            into(file("test-artifacts/screenshots/teleport-array-visualization"))
        }
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
    // zh_cn intentionally reuses zh_tw; maintain only the Traditional Chinese source.
    doLast {
        copy {
            from(file('src/main/resources/assets/totem/lang/zh_tw.json'))
            into(file("${destinationDir}/assets/totem/lang"))
            rename { 'zh_cn.json' }
        }
    }
}

// Loom derives this manifest attribute from a set of client classes.  Its
// iteration order is otherwise host-dependent, which makes the published JAR
// checksum vary despite identical bytecode and resources.  Canonicalize the
// manifest and archive entry order after Loom has assembled the development
// JAR so the lockstep manifest can pin a reproducible artifact.
tasks.named('jar', Jar) {
    preserveFileTimestamps = false
    reproducibleFileOrder = true

    doLast {
        def archive = archiveFile.get().asFile
        def replacement = new File(archive.parentFile, "${archive.name}.normalized")
        def source = new java.util.jar.JarFile(archive)

        try {
            def sourceManifest = source.manifest
            def normalizedManifest = new java.util.jar.Manifest()
            def attributes = sourceManifest.mainAttributes
            normalizedManifest.mainAttributes.putValue(
                    'Manifest-Version',
                    attributes.getValue('Manifest-Version') ?: '1.0'
            )

            attributes.keySet()
                    .collect { it.toString() }
                    .findAll { it != 'Manifest-Version' }
                    .sort()
                    .each { name ->
                        def value = attributes.getValue(name)
                        if (name == 'Fabric-Loom-Client-Only-Entries') {
                            value = value.split(';').findAll { it }.sort().join(';')
                        }
                        normalizedManifest.mainAttributes.putValue(name, value)
                    }

            def entries = []
            def enumeration = source.entries()
            while (enumeration.hasMoreElements()) {
                entries << enumeration.nextElement()
            }

            def output = new java.util.jar.JarOutputStream(
                    new java.io.FileOutputStream(replacement)
            )
            try {
                // JarOutputStream's Manifest constructor stamps the generated
                // manifest entry with the current time. Write that entry
                // explicitly so it receives the same fixed timestamp as the
                // rest of this canonical archive.
                def manifestEntry = new java.util.zip.ZipEntry('META-INF/MANIFEST.MF')
                manifestEntry.setTime(0L)
                output.putNextEntry(manifestEntry)
                normalizedManifest.write(output)
                output.closeEntry()

                entries.findAll { it.name != 'META-INF/MANIFEST.MF' }
                        .sort { it.name }
                        .each { entry ->
                            def normalizedEntry = new java.util.zip.ZipEntry(entry.name)
                            normalizedEntry.setTime(0L)
                            output.putNextEntry(normalizedEntry)
                            if (!entry.directory) {
                                source.getInputStream(entry).withCloseable { input ->
                                    input.transferTo(output)
                                }
                            }
                            output.closeEntry()
                        }
            } finally {
                output.close()
            }
        } finally {
            source.close()
        }

        java.nio.file.Files.move(
                replacement.toPath(),
                archive.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING
        )
    }
}

// Dedicated server + two real clients for the access picker and generic Observer provider.
sourceSets {
    accessE2e {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
}
def accessObserverJar = file(providers.gradleProperty('accessObserverJar')
        .getOrElse('../TotemObserver/build/libs/totem-observer-0.1.0.jar'))
sourceSets.accessE2e.runtimeClasspath += files(accessObserverJar)
loom {
    mods { 'totem-nexus-access-e2e' { sourceSet sourceSets.accessE2e } }
    runs {
        accessE2eServer {
            server(); source sourceSets.accessE2e; runDir 'build/access-e2e/server'
            vmArg "-Dnexus.access.e2e.results=${file('build/access-e2e/results').absolutePath}"
        }
        accessE2eClient {
            client(); source sourceSets.accessE2e; runDir 'build/access-e2e/target'
            vmArg "-Dnexus.access.e2e.results=${file('build/access-e2e/results').absolutePath}"
        }
    }
}
tasks.register('prepareAccessE2e') {
    dependsOn('accessE2eClasses', 'configureClientLaunch', 'configureLaunch', 'normalizeFabricApiTweakersForNamedDevRuntime')
    doLast {
        if (!accessObserverJar.isFile()) throw new GradleException("Missing Observer jar: ${accessObserverJar}")
        def dir = file('build/access-e2e'); dir.mkdirs()
        def cp = tasks.named('runAccessE2eClient').get().classpath.asPath.replace('\\','\\\\').replace('"','\\"')
        new File(dir,'client.args').text = "-classpath\n\"${cp}\"\n"
        def serverCp = tasks.named('runAccessE2eServer').get().classpath.asPath.replace('\\','\\\\').replace('"','\\"')
        new File(dir,'server.args').text = "-classpath\n\"${serverCp}\"\n"
    }
}
